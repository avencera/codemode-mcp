# Publish a signed macOS binary and a Linux binary when a version tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Asset name: codemode-mcp-<tag>-<target>.tar.gz, holding `codemode-mcp` and the
# Monty worker it pins, for `codemode-mcp update`. The hub is Apple silicon
# only, signed; x86_64 Linux is for spokes and unsigned, since signatures exist
# for the macOS keychain and the 1Password app

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # `update` compares the tag with what the installed binary reports, so
      # a tag ahead of Cargo.toml would reinstall and restart on every run
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "codemode-mcp") | .version')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      # a draft until the archive is attached: `update` follows
      # releases/latest, which would otherwise point at a release with no assets
      - uses: taiki-e/create-gh-release-action@v1
        with:
          draft: true

  upload-assets:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # monty 1.1.0 needs a newer std than the runner image's toolchain
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      # macOS and the 1Password app key their grants to an ad-hoc binary by its
      # hash, so each build re-prompted; a stable certificate lets a grant
      # survive updates. A missing secret fails the release instead of shipping
      # unsigned. Same identity and secrets as homebased
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${IDENTITY:?set the MACOS_SIGNING_IDENTITY repository variable}"
          : "${P12_BASE64:?set the MACOS_SIGNING_P12_BASE64 repository secret}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$IDENTITY\""
      # the worker speaks the protocol of the monty-pool version in the lock
      # file, and monty-runtime is released in step with it
      - name: Build and sign the Monty worker
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          version="$(awk '/^name = "monty-pool"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
          : "${version:?monty-pool is not in Cargo.lock}"
          cargo install monty-runtime --version "=$version" --locked --root "$RUNNER_TEMP/monty"
          codesign --force --options runtime --sign "$IDENTITY" --identifier com.avencera.monty "$RUNNER_TEMP/monty/bin/monty"
      # signed here rather than by upload-rust-binary-action, which cannot pass
      # entitlements; flags and identifier match what `service install` uses
      - name: Build and sign codemode-mcp
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          cargo build --release --locked --target aarch64-apple-darwin --bin codemode-mcp
          codesign --force --options runtime --entitlements assets/codemode-mcp.entitlements \
            --sign "$IDENTITY" --identifier com.avencera.codemode-mcp \
            target/aarch64-apple-darwin/release/codemode-mcp
      # `update` downloads <archive>.tar.gz and checks it against the
      # `sha256sum`-style line in <archive>.sha256
      - name: Upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="codemode-mcp-$GITHUB_REF_NAME-aarch64-apple-darwin"
          staging="$RUNNER_TEMP/staging"
          mkdir "$staging"
          cp target/aarch64-apple-darwin/release/codemode-mcp "$RUNNER_TEMP/monty/bin/monty" "$staging/"
          tar -C "$staging" -czf "$archive.tar.gz" codemode-mcp monty
          shasum -a 256 "$archive.tar.gz" > "$archive.sha256"
          gh release upload "$GITHUB_REF_NAME" "$archive.tar.gz" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  upload-linux:
    needs: create-release
    # needs glibc 2.39 or newer at run time, as this image has
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # monty 1.1.0 needs a newer std than the runner image's toolchain
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Build the Monty worker
        run: |
          version="$(awk '/^name = "monty-pool"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
          : "${version:?monty-pool is not in Cargo.lock}"
          cargo install monty-runtime --version "=$version" --locked --root "$RUNNER_TEMP/monty"
      - name: Build codemode-mcp
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu --bin codemode-mcp
      - name: Upload the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="codemode-mcp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu"
          staging="$RUNNER_TEMP/staging"
          mkdir "$staging"
          cp target/x86_64-unknown-linux-gnu/release/codemode-mcp "$RUNNER_TEMP/monty/bin/monty" "$staging/"
          tar -C "$staging" -czf "$archive.tar.gz" codemode-mcp monty
          sha256sum "$archive.tar.gz" > "$archive.sha256"
          gh release upload "$GITHUB_REF_NAME" "$archive.tar.gz" "$archive.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    needs: [upload-assets, upload-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # attached to every release, so releases/latest/download/install.sh works
      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" install.sh --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
