# Publish a signed macOS binary when a version tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Asset name: codemode-mcp-<tag>-<target>.tar.gz, holding `codemode-mcp` and the
# Monty worker it pins, both signed, for `codemode-mcp update`. Only Apple
# silicon is built, since the service is a launchd agent

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # `update` compares the tag with what the installed binary reports, so
      # a tag ahead of Cargo.toml would reinstall and restart on every run
      - name: Check the tag matches Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "codemode-mcp") | .version')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      # a draft until the archive is attached: `update` follows
      # releases/latest, which would otherwise point at a release with no assets
      - uses: taiki-e/create-gh-release-action@v1
        with:
          draft: true

  upload-assets:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # monty 1.1.0 needs a newer std than the runner image's toolchain
      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable
      # macOS and the 1Password app key their grants to an ad-hoc binary by its
      # hash, so each build re-prompted; a stable certificate lets a grant
      # survive updates. A missing secret fails the release instead of shipping
      # unsigned. Same identity and secrets as homebased
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${IDENTITY:?set the MACOS_SIGNING_IDENTITY repository variable}"
          : "${P12_BASE64:?set the MACOS_SIGNING_P12_BASE64 repository secret}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$IDENTITY\""
      # the worker speaks the protocol of the monty-pool version in the lock
      # file, and monty-runtime is released in step with it
      - name: Build and sign the Monty worker
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          version="$(awk '/^name = "monty-pool"$/ { getline; gsub(/version = |"/, ""); print }' Cargo.lock)"
          : "${version:?monty-pool is not in Cargo.lock}"
          cargo install monty-runtime --version "=$version" --locked --root "$RUNNER_TEMP/monty"
          codesign --force --sign "$IDENTITY" --identifier com.avencera.monty "$RUNNER_TEMP/monty/bin/monty"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: codemode-mcp
          package: codemode-mcp
          target: aarch64-apple-darwin
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          locked: true
          # the prefix makes the identifier com.avencera.codemode-mcp, matching
          # what `service install` signs a local build as
          codesign: ${{ vars.MACOS_SIGNING_IDENTITY }}
          codesign-prefix: com.avencera.
          include: ${{ runner.temp }}/monty/bin/monty

  publish-release:
    needs: upload-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
