[package]
name = "codemode-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6"
hmac = "0.13.0"
http = "1.5.0"
monty-pool = "=1.1.0"
monty-types = "=1.1.0"
num-bigint = "0.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = [
    "client",
    "server",
    "macros",
    "reqwest",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
# arbitrary_precision keeps integers beyond i64/u64 exact in both directions
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync", "io-util", "io-std"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
webauthn-rs = "0.5.5"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

# stdio MCP server used only by the integration tests; lives in tests/ so it
# stays out of the shipped sources but still gets CARGO_BIN_EXE_ for free
[[bin]]
name = "codemode-fixture"
path = "tests/fixtures/fixture_server.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
