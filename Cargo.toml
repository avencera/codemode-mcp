[workspace]
members = [".", "crates/companion-wire", "crates/uniffi_cli", "mobile", "xtask"]
resolver = "3"

[package]
name = "codemode-mcp"
version = "0.4.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# rmcp's CredentialStore and StateStore traits are declared with async-trait
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
companion-wire = { path = "crates/companion-wire", features = ["seal"] }
color-eyre = "0.6"
# turso's futures finish on the calling thread, so the store blocks on them
# without a runtime
futures-executor = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
# no portmapper (it opens router ports) and no metrics; rustls already uses
# aws-lc-rs, so iroh does too
iroh = { version = "1.3.0", default-features = false, features = ["tls-aws-lc-rs", "fast-apple-datapath"] }
jiff = "0.2.38"
# the ES256 provider token of APNs requests; aws-lc-rs is in the tree already
# through rustls
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
monty-pool = "=1.1.0"
monty-types = "=1.1.0"
num-bigint = "0.4"
# the QR code of `companion invite`; text output only, so no image or SVG
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
# http2: APNs takes HTTP/2 only
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = [
    "auth",
    "client",
    "server",
    "macros",
    "reqwest",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# the parser behind the escape-hatch ban; pinned to the version Monty 1.1.0
# uses, so the ban reads scripts the way the sandbox does
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
# already in the tree through turso; flock gives each state dir one daemon,
# kill(pid, 0) spares a live CLI exec's rows at boot, and the uid check keeps
# the cleanup of stale temp dirs to this user's own
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
schemars = "1.2.2"
# rc: Arc<str> and Arc<Map> inside parked executions and stored approvals
serde = { version = "1.0.229", features = ["derive", "rc"] }
# arbitrary_precision keeps integers beyond i64/u64 exact in both directions
serde_json = { version = "1", features = ["arbitrary_precision"] }
# SHA-1 for one-time codes, which most sites still issue; on the same digest
# line as `hmac` and `sha2`
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync", "io-util", "io-std"] }
tokio-util = "0.7.20"
toml = "1.1.8"
# no mimalloc (it installs a global allocator) and no full-text search
turso = { version = "0.8.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
# danger-allow-state-serialisation: ceremony state is kept in the database
# (server side, 5 minutes, bound to its approval) so a page loaded before a
# restart still completes; the state never goes to the browser
# 0.6 replaces OpenSSL with RustCrypto: the hardened runtime refuses
# Homebrew's dylib, and vendoring it froze its security fixes
webauthn-rs = { version = "=0.6.1-dev", features = ["danger-allow-state-serialisation"] }

# EventKit for the calendar and reminders adapters; defaults off, since they
# pull in AppKit, MapKit and CoreLocation bindings nothing here uses
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
# 0.2.190 limits `in6_ifreq` and the routing socket constants to macOS,
# which breaks iroh's netdev and netwatch on iOS; pinned exactly, since the
# workspace shares one lockfile and the phone gets this version too
libc = "=0.2.189"
objc2 = "0.6.5"
# Safari's "Allow JavaScript from Apple Events" setting, for the `logins`
# server; already in the tree
plist = "1.10.1"
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "EKAlarm",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKRecurrenceEnd",
    "EKRecurrenceRule",
    "EKReminder",
    "EKSource",
    "EKTypes",
] }
# Accessibility, for the `logins` server: the focused field, its kind and
# the address of the page holding it
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "AXError",
    "AXUIElement",
    "HIServices",
    "libc",
] }
# screen lock and input idle time, to tell whether the owner is at the Mac;
# CFURL and the CGEvent features are for the `logins` server's typing
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGSession",
    "libc",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSCalendar",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSObject",
    "NSPredicate",
    "NSString",
    "NSTimeZone",
    "NSURL",
] }
# the login keychain holds the iroh identity keys
security-framework = "3.7.0"
# Touch ID prompts for approving a tool call at the Mac
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "LAContext",
    "LAError",
] }

[dev-dependencies]
# a throwaway ES256 key for the fake APNs server in the phone tests
aws-lc-rs = "1.18.2"
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "=0.6.1-dev", features = ["softpasskey"] }

# the URL type security-framework takes, to check the browser table against
# the installed apps; already in the tree through it
[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10.1"

# stdio MCP server used only by the integration tests; lives in tests/ so it
# stays out of the shipped sources but still gets CARGO_BIN_EXE_ for free
[[bin]]
name = "codemode-fixture"
path = "tests/fixtures/fixture_server.rs"

# the calendar and reminders adapters over an in-memory store, standing in
# for EventKit in the adapter tests
[[bin]]
name = "codemode-fake-eventkit"
path = "tests/fixtures/fake_eventkit.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
