[package]
name = "codemode-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# rmcp's CredentialStore and StateStore traits are declared with async-trait
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6"
# turso's futures finish on the calling thread, so the store blocks on them
# without a runtime
futures-executor = "0.3.34"
hmac = "0.13.0"
http = "1.5.0"
jiff = "0.2.38"
monty-pool = "=1.1.0"
monty-types = "=1.1.0"
num-bigint = "0.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.5.1", default-features = false, features = [
    "auth",
    "client",
    "server",
    "macros",
    "reqwest",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# the parser behind the escape-hatch ban; pinned to the version Monty 1.1.0
# uses, so the ban reads scripts the way the sandbox does
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
# already in the tree through turso; flock gives each state dir one daemon,
# kill(pid, 0) spares a live CLI exec's rows at boot, and the uid check keeps
# the cleanup of stale temp dirs to this user's own
rustix = { version = "1.1.5", features = ["fs", "process"] }
schemars = "1.2.2"
# rc: Arc<str> and Arc<Map> inside parked executions and stored approvals
serde = { version = "1.0.229", features = ["derive", "rc"] }
# arbitrary_precision keeps integers beyond i64/u64 exact in both directions
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "signal", "sync", "io-util", "io-std"] }
tokio-util = "0.7.20"
toml = "1.1.8"
# no mimalloc (it installs a global allocator) and no full-text search
turso = { version = "0.8.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
# danger-allow-state-serialisation: ceremony state is kept in the database
# (server side, 5 minutes, bound to its approval) so a page loaded before a
# restart still completes; the state never goes to the browser
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

# stdio MCP server used only by the integration tests; lives in tests/ so it
# stays out of the shipped sources but still gets CARGO_BIN_EXE_ for free
[[bin]]
name = "codemode-fixture"
path = "tests/fixtures/fixture_server.rs"

# fake homebased CLI for the adapter tests
[[bin]]
name = "codemode-fake-homebased"
path = "tests/fixtures/fake_homebased.rs"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
