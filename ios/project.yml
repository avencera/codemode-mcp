# The Xcode project is generated from this file (`just ios-project`) and not
# checked in, so the two never drift
name: Companion
options:
  bundleIdPrefix: com.avencera.codemode-mcp
  deploymentTarget:
    # must match DEPLOYMENT_TARGET in xtask/src/ios.rs
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  CompanionCore:
    path: CompanionCore
settings:
  base:
    DEVELOPMENT_TEAM: Q8UP8C53Y8
    CODE_SIGN_STYLE: Automatic
    # the generated bindings predate Swift 6's concurrency checks
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Companion:
    type: application
    platform: iOS
    sources:
      - Companion
      - Shared
    dependencies:
      - package: CompanionCore
      # embedded, so 1Password's share sheet lists the app
      - target: CompanionShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avencera.codemode-mcp.companion
        PRODUCT_NAME: Companion
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Companion/Info.plist
      properties:
        # App Store Connect refuses a name another app has taken, as
        # "Companion" is
        CFBundleDisplayName: CMCP Companion
        CFBundleName: CMCP Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # answers App Store Connect's export compliance question for every
        # build, which otherwise holds each upload until it is answered
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Companion scans the QR code `codemode-mcp companion invite` shows, to pair with the gateway.
        NSFaceIDUsageDescription: Face ID approves each 1Password read the gateway asks this iPhone for.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Companion/Companion.entitlements
      properties:
        # an App Store export switches this to production
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        # the share extension leaves shared files here for the app
        com.apple.security.application-groups:
          - group.com.avencera.codemode-mcp.companion
  CompanionShare:
    type: app-extension
    platform: iOS
    sources:
      - CompanionShare
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avencera.codemode-mcp.companion.share
        PRODUCT_NAME: CompanionShare
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: CompanionShare/Info.plist
      properties:
        CFBundleDisplayName: CMCP Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # one shared file of any kind, such as a .p12 from 1Password
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY
              ($extensionItem.attachments, $attachment, ANY
              $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO
              "public.data").@count == 1).@count == 1
    entitlements:
      path: CompanionShare/CompanionShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.avencera.codemode-mcp.companion
