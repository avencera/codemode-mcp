[package]
name = "companion-wire"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "What the codemode-mcp gateway, its companion Macs and its paired phones send each other"

[features]
# sealing to a phone's P-256 key and opening with a software key; the
# gateway seals, the tests open, and the phone itself opens in CryptoKit
seal = ["dep:hpke"]
# one-time codes from a 1Password seed; the gateway computes them for its
# own fills, and the phone for a fill on another machine
totp = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:url"]

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
hmac = { version = "0.13.0", optional = true }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "nistp", "aes"], optional = true }
# EndpointId and SecretKey without iroh's networking, so the phone's core
# and the gateway agree on the types without the phone pulling the gateway
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
thiserror = "2.0.21"
url = { version = "2.5.8", optional = true }
# owned copies of typed text and filled values are wiped on drop
zeroize = "1.8.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
