[package]
name = "companion-wire"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "What the codemode-mcp gateway, its companion Macs and its paired phones send each other"

[features]
# sealing to a phone's P-256 key and opening with a software key; the
# gateway seals, the tests open, and the phone itself opens in CryptoKit
seal = ["dep:hpke"]

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "nistp", "aes"], optional = true }
# EndpointId and SecretKey without iroh's networking, so the phone's core
# and the gateway agree on the types without the phone pulling the gateway
iroh-base = { version = "1.3.0", default-features = false, features = ["key"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
