# codemode-mcp configuration of a spoke
#
# Written by `codemode-mcp config init --hub`. This machine is a spoke of the
# hub Mac, which holds 1Password, the passkeys, sign-ins and approvals. The
# hub's servers show up here like local ones; calls to them run on the hub,
# and `ask` tools of this machine's own servers are approved there too. The
# first start asks on the hub to trust this machine. See docs/operations.md,
# "Spokes"

# For browser sessions on this machine (see `[servers.code_browser]` below).
# Top-level keys come before `[hub]`. Where agent-browser is, when it is not
# on the daemon's PATH or in ~/.local/bin
# agent_browser_path = "{{HOME}}/.local/bin/agent-browser"
# where Remove on the phone moves a session's profile, since Linux has no
# ~/.Trash; made on first use
# browser_trash = "{{HOME}}/.local/share/codemode-mcp/browser-trash"

[hub]
# the hub's MagicDNS name or tailnet IP, with :port when it is not 7681
host = {{HUB}}
# only these hub servers; every one when unset
# servers = ["linear", "github"]
# or every hub server but these
# exclude = ["xcode"]
# the address the phone dials this machine's browser sessions at, such as its
# tailnet IP; any free port when unset
# browser_listen = "100.x.y.z:7682"

# write_env and find_references on this machine: they write 1Password values
# into files here, approved on the hub, and the agent sees only the names
[servers.secrets]
builtin = "secrets"

# This machine's own servers, for work that has to touch it: files, Docker,
# GPUs. A name a hub server already uses is refused at startup. For example
# [servers.files]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "{{HOME}}/code"]

# Browser sessions on this machine, in its own Chrome (`agent-browser open
# --engine chrome`), signed in from the hub's 1Password and handed to the
# hub's phones, which dial this machine to take them over. The hub's own
# `browser` server already shows here as `browser`, so this one needs another
# name. `fill` must ask on every call
# [servers.code_browser]
# builtin = "browser"
# policy = "ask"
# tools.fill.grant = "per_call"
# tools.handoff.policy = "allow"
