# codemode-mcp configuration
#
# Written by `codemode-mcp config init`. Every option and its default is
# described in docs/design.md and docs/operations.md. Approval notifications
# use the [notify.ntfy] section of ~/.config/homebased/config.toml unless a
# [notify.ntfy] section is added here. While you are at the Mac, a request
# shows a Touch ID prompt there first and reaches the phone only if it is
# still waiting a minute later; [notify.mac] tunes or turns this off

# Where the phone reaches the approval pages, usually a `tailscale serve`
# address (`tailscale status --json | jq -r .Self.DNSName` prints the name).
# Unset, links point at http://localhost:7681 and open only on this Mac. Its
# host is the passkeys' relying party id, so changing it orphans them
# public_origin = "https://mac.tailnet-name.ts.net:8443"

# 1Password Environments: every call needs approval, with Touch ID at the Mac
# or a passkey on the phone. Read tools accept a 15 or 60 minute session
# grant; writes ask on every call
[servers.onepassword]
command = "/Applications/1Password.app/Contents/MacOS/1password-mcp"
policy = "ask"
# every Environments tool takes the account ID; the gateway passes it, so
# scripts never see the parameter. `op account list` prints yours
arguments = { accountId = "YOUR_ACCOUNT_ID" }
# authenticate grants the scopes the other tools check, for the life of the
# connection; it runs before the first call on each one, inside that call's
# approval, so nothing prompts on the Mac until a call is approved
setup = [{ tool = "authenticate" }]
aliases = ["1password"]

[servers.onepassword.tools.authenticate]
output_schema = { type = "object", required = ["account_id"], properties = { account_id = { type = "string" } } }
[servers.onepassword.tools.list_environments]
output_schema = { type = "object", required = ["environments"], properties = { environments = { type = "array", items = { type = "object", properties = { id = { type = "string" }, name = { type = "string" } } } } } }

# shapes from the response structs in the 1password-mcp binary; the three
# tools without one answer with prose, kept as text
[servers.onepassword.tools.list_variables]
output_schema = { type = "object", required = ["variableNames"], properties = { variableNames = { type = "array", items = { type = "string" } } } }
[servers.onepassword.tools.list_local_env_files]
output_schema = { type = "object", required = ["localEnvFiles"], properties = { localEnvFiles = { type = "array", items = { type = "object", required = ["id", "mountPath", "isEnabled"], properties = { id = { type = "string" }, mountPath = { type = "string" }, isEnabled = { type = "boolean" } } } } } }

[servers.onepassword.tools.create_environment]
grant = "per_call"
output_schema = { type = "object", required = ["environmentId"], properties = { environmentId = { type = "string" } } }
[servers.onepassword.tools.rename_environment]
grant = "per_call"
output = "text"
[servers.onepassword.tools.append_variables]
grant = "per_call"
output = "text"
[servers.onepassword.tools.create_local_env_file]
grant = "per_call"
output = "text"

# `codemode-mcp op warm` runs these on the Mac so the 1Password app's own
# prompts appear there first
[servers.onepassword.warm]
calls = [{ tool = "authenticate" }, { tool = "list_environments" }]

# Result types. A tool that declares no output schema returns a `JsonValue`
# the script has to narrow, so the tools below say what they return. An
# `output_schema` applies only while the upstream declares none (add
# `force_output_schema = true` to override one), and results are checked
# against it. `output = "text"` returns the text as a `str`, unparsed.
# `codemode-mcp review` ranks the tools still returning `JsonValue`
[servers.openai_docs]
url = "https://developers.openai.com/mcp"

[servers.openai_docs.tools.fetch_openai_doc]
output = "text"

# one hit of search_openai_docs and list_openai_docs; the Algolia
# `_highlightResult` markup is left out on purpose
[servers.openai_docs.tools.search_openai_docs]
output_schema = { type = "object", required = ["hits", "nbHits", "page"], properties = { nbHits = { type = "integer" }, page = { type = "integer" }, nextCursor = { type = ["string", "null"] }, hits = { type = "array", items = { type = "object", required = ["url", "url_without_anchor", "type", "anchor", "content", "hierarchy", "objectID"], properties = { url = { type = "string" }, url_without_anchor = { type = "string" }, type = { type = "string" }, anchor = { type = "string" }, content = { type = ["string", "null"] }, objectID = { type = "string" }, hierarchy = { type = "object", required = ["lvl0", "lvl1"], properties = { lvl0 = { type = "string" }, lvl1 = { type = "string" }, lvl2 = { type = ["string", "null"] }, lvl3 = { type = ["string", "null"] }, lvl4 = { type = ["string", "null"] }, lvl5 = { type = ["string", "null"] }, lvl6 = { type = ["string", "null"] } } } } } } } }

[servers.openai_docs.tools.list_openai_docs]
output_schema = { type = "object", required = ["hits", "nbHits", "page"], properties = { nbHits = { type = "integer" }, page = { type = "integer" }, nextCursor = { type = ["string", "null"] }, hits = { type = "array", items = { type = "object", required = ["url", "url_without_anchor", "type", "anchor", "content", "hierarchy", "objectID"], properties = { url = { type = "string" }, url_without_anchor = { type = "string" }, type = { type = "string" }, anchor = { type = "string" }, content = { type = ["string", "null"] }, objectID = { type = "string" }, hierarchy = { type = "object", required = ["lvl0", "lvl1"], properties = { lvl0 = { type = "string" }, lvl1 = { type = "string" }, lvl2 = { type = ["string", "null"] }, lvl3 = { type = ["string", "null"] }, lvl4 = { type = ["string", "null"] }, lvl5 = { type = ["string", "null"] }, lvl6 = { type = ["string", "null"] } } } } } } } }

[servers.openai_docs.tools.list_api_endpoints]
output_schema = { type = "object", required = ["baseUrls", "paths", "total", "urls"], properties = { baseUrls = { type = "array", items = { type = "string" } }, paths = { type = "array", items = { type = "string" } }, urls = { type = "array", items = { type = "string" } }, total = { type = "integer" } } }

# Calendar and Reminders through EventKit, covering every account the Mac's
# apps show. macOS asks once for each, on the Mac, the first time the daemon
# starts the adapter. Reads run freely; every change asks on the phone, and a
# session grant covers that session's later changes. Not `sensitive`, so
# titles and times reach the usage log like any other result
[servers.calendar]
command = "{{HOME}}/.local/bin/codemode-mcp"
args = ["adapter", "calendar"]
sensitive = false

[servers.calendar.tools.create_event]
policy = "ask"
[servers.calendar.tools.update_event]
policy = "ask"
[servers.calendar.tools.delete_event]
policy = "ask"

[servers.reminders]
command = "{{HOME}}/.local/bin/codemode-mcp"
args = ["adapter", "reminders"]
sensitive = false

[servers.reminders.tools.create_reminder]
policy = "ask"
[servers.reminders.tools.update_reminder]
policy = "ask"
[servers.reminders.tools.complete_reminder]
policy = "ask"
[servers.reminders.tools.delete_reminder]
policy = "ask"

# Signs an agent that drives this Mac's screen in to any website with the
# 1Password login saved for it, typing the username, password or current
# one-time code into the focused field without returning it. A password goes
# only into a password field, and any of them only on an https page, in a
# code-signed Safari, Chrome, Firefox, Edge, Brave or Arc that other
# programs cannot script. Every fill asks, naming the login and the host:
# Touch ID at the Mac, else a passkey on the phone, where you then pick the
# login yourself. The first fill asks macOS for Accessibility. To enable,
# uncomment
# [servers.logins]
# builtin = "logins"
# policy = "ask"
# tools.fill.grant = "per_call"

# Xcode's own MCP bridge (Xcode 26.3 or later). Xcode approves the daemon as
# one agent for every client: the first XcodeOpenWorkspace or XcodeNewProject
# asks on the Mac to approve it and that project's folder, and other tools
# fail until then. Builds, tests, runs and project edits are
# allowed like a shell's; running a code snippet or an lldb command, and
# removing files, ask on the phone. Not `sensitive`, so file contents reach
# the usage log
[servers.xcode]
command = "/usr/bin/xcrun"
args = ["mcpbridge"]
sensitive = false

[servers.xcode.tools.RunCodeSnippet]
policy = "ask"
[servers.xcode.tools.InvokeDebuggerCommand]
policy = "ask"
[servers.xcode.tools.XcodeRM]
policy = "ask"
